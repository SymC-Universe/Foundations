name: Stability Inheritance pyFBS Lab Metadata

on:
  push:
    branches:
      - stability-inheritance
    paths:
      - "stability_inheritance/inspect_pyfbs_lab_metadata_v0_1.py"
      - ".github/workflows/stability-inheritance-pyfbs-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - run: python stability_inheritance/inspect_pyfbs_lab_metadata_v0_1.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stability-inheritance-pyfbs-lab-metadata
          path: stability_inheritance/results/pyfbs_lab_metadata/metadata.json
          if-no-files-found: error
