name: Chi Architecture D02F FLOOD-SHAB Reproduction

on:
  push:
    branches:
      - chi-architecture-p0
    paths:
      - "chi_architecture/src/d02f_flood_shab.py"
      - "chi_architecture/tests/test_d02f_flood_shab.py"
      - "chi_architecture/reproduce.py"
      - "chi_architecture/d02f/D02F_FLOOD_SHAB_MFR14_v0.1.md"
      - ".github/workflows/chi-architecture-d02f.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-d02f:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check -r chi_architecture/requirements-p0.txt
          python -m pip check
      - name: Reproduce D02F
        run: python chi_architecture/reproduce.py d02f
      - name: Guard frozen scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("chi_architecture/results/D02F_FLOOD_SHAB_PROSPECTIVE_RESULT_v0.1.json").read_text())
          assert r["schema"]=="d02f-flood-shab-prospective-result-v0.1"
          assert r["claim_id"]=="CA-D007-D02F-v0.1"
          assert r["primary"]["mode"]=="mode_01"
          assert set(r["secondary_robustness"])=={"mode_02","mode_03"}
          assert r["native_intervention_power_gate"]["pass"] is True
          assert set(r["primary"]["bins"])=={"E1_LOW","E2","E3","E4_HIGH"}
          print("D02F frozen-scope guards passed")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chi-architecture-d02f-flood-shab-v01
          path: |
            chi_architecture/results/D02F_FLOOD_SHAB_PROSPECTIVE_RESULT_v0.1.json
            chi_architecture/results/D02F_SUMMARY_v0.1.json
            chi_architecture/results/D02F_RESULT_CARD_v0.1.md
            chi_architecture/results/D02F_ENVIRONMENT_v0.1.txt
            chi_architecture/results/D02F_REPRO_MANIFEST_v0.1.json
          retention-days: 90
          if-no-files-found: error
