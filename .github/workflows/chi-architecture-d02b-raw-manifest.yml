name: D02B Raw Archive Manifest Lock

on:
  push:
    branches:
      - chi-architecture-p0
    paths:
      - "chi_architecture/d02b/raw_archive_manifest.py"
      - "chi_architecture/d02b/D02B_EXACT_SOURCE_MAPPING_v0.1.md"
      - ".github/workflows/chi-architecture-d02b-raw-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raw-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check -r chi_architecture/requirements-p0.txt
          python -m pip check
      - name: Download raw archive and emit path manifest only
        run: python chi_architecture/d02b/raw_archive_manifest.py
      - name: Guard no-value raw manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("chi_architecture/results/D02B_RAW_ARCHIVE_MANIFEST_v0.1.json").read_text())
          assert r["status"]=="RAW_ARCHIVE_PATHS_ONLY_NO_FRF_VALUES_READ"
          assert r["counts"]["amplitude_files"]==919
          assert r["counts"]["phase_files"]==919
          assert r["counts"]["all_files"]==1838
          print("D02B raw archive manifest guard passed")
          PY
      - name: Upload path-only raw manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d02b-raw-archive-manifest-v01
          path: chi_architecture/results/D02B_RAW_ARCHIVE_MANIFEST_v0.1.json
          retention-days: 90
          if-no-files-found: error
