name: D02B Source Schema Lock

on:
  push:
    branches:
      - chi-architecture-p0
    paths:
      - "chi_architecture/d02b/acquire_schema.py"
      - "chi_architecture/d02b/D02B_SOURCE_CONTRACT_v0.1.md"
      - ".github/workflows/chi-architecture-d02b-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check -r chi_architecture/requirements-p0.txt
          python -m pip check

      - name: Acquire and hash sources, emit schema only
        run: python chi_architecture/d02b/acquire_schema.py

      - name: Guard schema-only artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("chi_architecture/results/D02B_SOURCE_SCHEMA_v0.1.json")
          r=json.loads(p.read_text())
          assert r["status"]=="SCHEMA_ONLY_NO_NUMERIC_CELL_VALUES_EMITTED"
          assert r["workbook_schema"]["sheet_count"] > 0
          for s in r["workbook_schema"]["sheets"]:
              assert "numeric_values" not in s
          print("D02B schema-only guard passed")
          PY

      - name: Upload schema checkpoint artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d02b-source-schema-v01
          path: chi_architecture/results/D02B_SOURCE_SCHEMA_v0.1.json
          retention-days: 90
          if-no-files-found: error
