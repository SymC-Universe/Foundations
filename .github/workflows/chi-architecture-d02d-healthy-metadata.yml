name: D02D LUMO Healthy Metadata Lock

on:
  push:
    branches:
      - chi-architecture-p0
    paths:
      - "chi_architecture/d02d/lumo_healthy_metadata.py"
      - ".github/workflows/chi-architecture-d02d-healthy-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check -r chi_architecture/requirements-p0.txt
          python -m pip check
      - name: Emit healthy metadata only
        run: python chi_architecture/d02d/lumo_healthy_metadata.py
      - name: Guard healthy metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("chi_architecture/results/D02D_LUMO_HEALTHY_METADATA_v0.1.json").read_text())
          assert r["status"]=="HEALTHY_METADATA_ONLY"
          assert r["sample_count"]==990600
          assert r["channel_count"]==22
          assert 599.0 <= r["duration_seconds_from_shape"] <= 601.0
          print("D02D healthy metadata guard passed")
          PY
      - name: Upload healthy metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d02d-lumo-healthy-metadata-v01
          path: chi_architecture/results/D02D_LUMO_HEALTHY_METADATA_v0.1.json
          retention-days: 90
          if-no-files-found: error
