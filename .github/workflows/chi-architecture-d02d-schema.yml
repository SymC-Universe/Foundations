name: D02D LUMO Schema Probe

on:
  push:
    branches:
      - chi-architecture-p0
    paths:
      - "chi_architecture/d02d/lumo_schema_probe.py"
      - "chi_architecture/d02d/D02D_LUMO_SOURCE_LOCK_v0.1.json"
      - ".github/workflows/chi-architecture-d02d-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check -r chi_architecture/requirements-p0.txt
          python -m pip check
      - name: Probe representative LUMO schema
        run: python chi_architecture/d02d/lumo_schema_probe.py
      - name: Guard schema-only state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("chi_architecture/results/D02D_LUMO_SCHEMA_PROBE_v0.1.json").read_text())
          assert r["status"]=="SCHEMA_ONLY_NO_SCIENTIFIC_ARRAY_VALUES_EMITTED"
          assert r["archive"]["member_count"] > 0
          assert r["archive"]["mat_member_count"] > 0
          print("D02D LUMO schema-only guard passed")
          PY
      - name: Upload schema probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d02d-lumo-schema-v01
          path: chi_architecture/results/D02D_LUMO_SCHEMA_PROBE_v0.1.json
          retention-days: 90
          if-no-files-found: error
