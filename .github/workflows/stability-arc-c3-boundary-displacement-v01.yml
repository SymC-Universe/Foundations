name: Stability Arc c3 boundary displacement map v0.1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/stability-arc-gfsa-v072
    paths:
      - 'stability_arc/measurement_conditioned/c3_displacement_v01/**'
      - '.github/workflows/stability-arc-c3-boundary-displacement-v01.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frozen branch state
        uses: actions/checkout@v4

      - name: Record frozen source identities
        shell: bash
        run: |
          set -euo pipefail
          R=stability_arc/measurement_conditioned/c3_displacement_v01/results
          mkdir -p "$R"
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "prereg_sha256=$(sha256sum stability_arc/measurement_conditioned/c3_displacement_v01/PREREGISTRATION_C3_BOUNDARY_DISPLACEMENT_MAP_v0.1.md | awk '{print $1}')"
            echo "code_sha256=$(sha256sum stability_arc/measurement_conditioned/c3_displacement_v01/c3_boundary_displacement_audit_v01.py | awk '{print $1}')"
            echo "workflow_sha256=$(sha256sum .github/workflows/stability-arc-c3-boundary-displacement-v01.yml | awk '{print $1}')"
            echo "c3_derivation_result_sha256=$(sha256sum stability_arc/measurement_conditioned/c3_boundary_v01/C3_BOUNDARY_DERIVATION_RESULT_v0.1.md | awk '{print $1}')"
            echo "h5_result_sha256=$(sha256sum stability_arc/measurement_conditioned/c3_gate_test_v01/C3_GATE_CROSSING_RESULT_v0.1.md | awk '{print $1}')"
          } | tee "$R/source_identity.txt"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fixed audit dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3'
          python -m pip freeze | tee stability_arc/measurement_conditioned/c3_displacement_v01/results/environment_lock.txt

      - name: Execute frozen displacement audit
        shell: bash
        run: |
          set -euo pipefail
          python stability_arc/measurement_conditioned/c3_displacement_v01/c3_boundary_displacement_audit_v01.py \
            | tee stability_arc/measurement_conditioned/c3_displacement_v01/results/stdout.txt

      - name: Preserve and independently verify evidence hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd stability_arc/measurement_conditioned/c3_displacement_v01/results
          find . -maxdepth 1 -type f ! -name SHA256.txt ! -name MANIFEST_VERIFIED.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256.txt
          sha256sum -c SHA256.txt | tee MANIFEST_VERIFIED.txt

      - name: Upload displacement-map evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-arc-c3-boundary-displacement-v01
          path: stability_arc/measurement_conditioned/c3_displacement_v01/results/
          if-no-files-found: error
          retention-days: 90
