name: Stability Arc internal handoff package v1.0

on:
  push:
    branches:
      - agent/stability-arc-gfsa-v072
    paths:
      - 'stability_arc/handoff_v1.0/README_HANDOFF_v1.0.md'
      - 'stability_arc/handoff_v1.0/INTERNAL_TECHNICAL_MANUSCRIPT_v1.0.md'
      - 'stability_arc/handoff_v1.0/STABILITY_ARCHITECTURE_CONTRACT_v1.0.md'
      - 'stability_arc/handoff_v1.0/CHEMISTRY_HANDOFF_RULES_v1.0.md'
      - 'stability_arc/handoff_v1.0/EVIDENCE_AND_FAILURE_LEDGER_v1.0.md'
      - 'stability_arc/handoff_v1.0/REPRODUCIBILITY_AND_PROVENANCE_MAP_v1.0.md'
      - 'stability_arc/handoff_v1.0/OPEN_HOLDS_AND_NONCLAIMS_v1.0.md'
      - 'stability_arc/handoff_v1.0/PUBLICATION_EXTENSION_QUEUE_v1.0.md'
      - 'stability_arc/handoff_v1.0/RESUME_INSTRUCTIONS_v1.0.md'
      - 'stability_arc/handoff_v1.0/PACKAGE_STATE_v1.0.json'
      - '.github/workflows/stability-arc-handoff-package-v10.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout handoff state
        uses: actions/checkout@v4

      - name: Build exact manifest and package
        shell: bash
        run: |
          set -euo pipefail
          ROOT=stability_arc/handoff_v1.0
          cd "$ROOT"
          FILES=(
            README_HANDOFF_v1.0.md
            INTERNAL_TECHNICAL_MANUSCRIPT_v1.0.md
            STABILITY_ARCHITECTURE_CONTRACT_v1.0.md
            CHEMISTRY_HANDOFF_RULES_v1.0.md
            EVIDENCE_AND_FAILURE_LEDGER_v1.0.md
            REPRODUCIBILITY_AND_PROVENANCE_MAP_v1.0.md
            OPEN_HOLDS_AND_NONCLAIMS_v1.0.md
            PUBLICATION_EXTENSION_QUEUE_v1.0.md
            RESUME_INSTRUCTIONS_v1.0.md
            PACKAGE_STATE_v1.0.json
          )
          sha256sum "${FILES[@]}" | sort -k2 > MANIFEST_SHA256.txt
          sha256sum -c MANIFEST_SHA256.txt | tee MANIFEST_VERIFIED.txt
          cd ../..
          zip -r Stability_Arc_Internal_Handoff_v1.0.zip stability_arc/handoff_v1.0 \
            -x 'stability_arc/handoff_v1.0/MANIFEST_VERIFIED.txt'
          echo '--- MANIFEST_SHA256.txt ---'
          cat stability_arc/handoff_v1.0/MANIFEST_SHA256.txt
          echo '--- PACKAGE SHA256 ---'
          sha256sum Stability_Arc_Internal_Handoff_v1.0.zip
          echo "science_freeze_commit=5a1c0d3a579f0251374544973c1ff53194bba722"
          echo "package_build_commit=${GITHUB_SHA}"

      - name: Upload exact handoff bundle
        uses: actions/upload-artifact@v4
        with:
          name: Stability_Arc_Internal_Handoff_v1.0
          path: |
            Stability_Arc_Internal_Handoff_v1.0.zip
            stability_arc/handoff_v1.0/MANIFEST_SHA256.txt
            stability_arc/handoff_v1.0/MANIFEST_VERIFIED.txt
          if-no-files-found: error
          retention-days: 90
