name: Stability Arc dephasing D blind reveal v0.1

on:
  push:
    branches:
      - agent/stability-arc-gfsa-v072
    paths:
      - 'stability_arc/measurement_conditioned/dephasing_d_reveal_v01/PREREGISTRATION_DEPHASING_D_BLIND_REVEAL_v0.1.md'
      - 'stability_arc/measurement_conditioned/dephasing_d_reveal_v01/dephasing_d_blind_reveal_v01.py'
      - '.github/workflows/stability-arc-dephasing-d-blind-reveal-v01.yml'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout frozen branch state
        uses: actions/checkout@v4

      - name: Record frozen source identities
        shell: bash
        run: |
          set -euo pipefail
          R=stability_arc/measurement_conditioned/dephasing_d_reveal_v01/results
          mkdir -p "$R"
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "prereg_sha256=$(sha256sum stability_arc/measurement_conditioned/dephasing_d_reveal_v01/PREREGISTRATION_DEPHASING_D_BLIND_REVEAL_v0.1.md | awk '{print $1}')"
            echo "code_sha256=$(sha256sum stability_arc/measurement_conditioned/dephasing_d_reveal_v01/dephasing_d_blind_reveal_v01.py | awk '{print $1}')"
            echo "workflow_sha256=$(sha256sum .github/workflows/stability-arc-dephasing-d-blind-reveal-v01.yml | awk '{print $1}')"
            echo "h10_code_sha256=$(sha256sum stability_arc/measurement_conditioned/dephasing_crossing_v01/dephasing_crossing_transfer_v01.py | awk '{print $1}')"
            echo "h11_result_sha256=$(sha256sum stability_arc/measurement_conditioned/dephasing_d_availability_v01/DEPHASING_D_AVAILABILITY_RESULT_v0.1.md | awk '{print $1}')"
            echo "bound_h11_run=33269021023"
            echo "bound_h11_artifact=9719520204"
            echo "bound_selection_sha256=f0f266117f5f86ee6cf9e86667a73f4412844c2555a4fa0c81250f40978d80dc"
          } | tee "$R/source_identity.txt"

      - name: Download immutable H11 Stage-A artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p h11_input
          gh run download 33269021023 --repo SymC-Universe/Foundations \
            --name stability-arc-dephasing-d-availability-v01 --dir h11_input
          SEL=$(find h11_input -type f -name stageA_dephasing_d_selection.json -print -quit)
          test -n "$SEL"
          echo "f0f266117f5f86ee6cf9e86667a73f4412844c2555a4fa0c81250f40978d80dc  $SEL" | sha256sum -c -
          echo "SELECTION_PATH=$SEL" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fixed reveal dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3'
          python -m pip freeze | tee stability_arc/measurement_conditioned/dephasing_d_reveal_v01/results/environment_lock.txt

      - name: Execute frozen H11 blind reveal
        shell: bash
        run: |
          set -euo pipefail
          python stability_arc/measurement_conditioned/dephasing_d_reveal_v01/dephasing_d_blind_reveal_v01.py "$SELECTION_PATH" \
            | tee stability_arc/measurement_conditioned/dephasing_d_reveal_v01/results/stdout.txt

      - name: Preserve and independently verify evidence hashes
        shell: bash
        run: |
          set -euo pipefail
          cd stability_arc/measurement_conditioned/dephasing_d_reveal_v01/results
          find . -maxdepth 1 -type f ! -name SHA256.txt ! -name MANIFEST_VERIFIED.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256.txt
          sha256sum -c SHA256.txt | tee MANIFEST_VERIFIED.txt

      - name: Upload H11 blind-reveal evidence
        uses: actions/upload-artifact@v4
        with:
          name: stability-arc-dephasing-d-blind-reveal-v01
          path: stability_arc/measurement_conditioned/dephasing_d_reveal_v01/results/
          if-no-files-found: error
          retention-days: 90
