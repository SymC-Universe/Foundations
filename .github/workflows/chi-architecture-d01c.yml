name: Chi Architecture D01C Reproduction

on:
  push:
    branches:
      - chi-architecture-p0
    paths:
      - "chi_architecture/D01C_PREEXECUTION_FREEZE_v0.1.json"
      - "chi_architecture/D01C_LITERATURE_POSITION.md"
      - "chi_architecture/src/domain_map_nonnormal.py"
      - "chi_architecture/tests/test_domain_map_nonnormal.py"
      - "chi_architecture/reproduce.py"
      - "chi_architecture/requirements-p0.txt"
      - ".github/workflows/chi-architecture-d01c.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-d01c:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check -r chi_architecture/requirements-p0.txt
          python -m pip check

      - name: Reproduce D01C from one entrypoint
        run: python chi_architecture/reproduce.py d01c

      - name: Guard frozen scope and output completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path("chi_architecture/results/D01C_NONNORMAL_DOMAIN_MAP_v0.1.json").read_text())
          assert r["schema"] == "d01c-nonnormal-domain-map-result-v0.1"
          assert r["status"] == "P0_DOMAIN_MAP_NONNORMAL_LINEAR"
          assert r["case_count"] == 26
          assert r["expected_case_count"] == 26
          assert len(r["records"]) == 26
          assert r["master_scalar_searched"] is False
          assert r["physical_system_evidence"] is False
          assert r["cross_domain_confirmation"] is False
          assert r["max_spectral_residual"] < 1e-10
          assert all(x["scalar_status"] == "NO_MASTER_SCALAR_SEARCHED" for x in r["records"])
          print("D01C frozen-scope guards passed")
          PY

      - name: Upload one reviewer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chi-architecture-d01c-v01
          path: |
            chi_architecture/results/D01C_NONNORMAL_DOMAIN_MAP_v0.1.json
            chi_architecture/results/D01C_SUMMARY_v0.1.json
            chi_architecture/results/D01C_RESULT_CARD_v0.1.md
            chi_architecture/results/D01C_ENVIRONMENT_v0.1.txt
            chi_architecture/results/D01C_REPRO_MANIFEST_v0.1.json
          retention-days: 90
          if-no-files-found: error
