name: Stability Arc c3 displacement D3 high precision v0.2

on:
  workflow_dispatch:
  push:
    branches:
      - agent/stability-arc-gfsa-v072
    paths:
      - 'stability_arc/measurement_conditioned/c3_displacement_v02/PREREGISTRATION_C3_DISPLACEMENT_D3_HIGH_PRECISION_REMEDIATION_v0.2.md'
      - 'stability_arc/measurement_conditioned/c3_displacement_v02/c3_displacement_d3_high_precision_v02.py'
      - '.github/workflows/stability-arc-c3-displacement-d3-high-precision-v02.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frozen branch state
        uses: actions/checkout@v4

      - name: Record frozen source identities
        shell: bash
        run: |
          set -euo pipefail
          R=stability_arc/measurement_conditioned/c3_displacement_v02/results
          mkdir -p "$R"
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "prereg_sha256=$(sha256sum stability_arc/measurement_conditioned/c3_displacement_v02/PREREGISTRATION_C3_DISPLACEMENT_D3_HIGH_PRECISION_REMEDIATION_v0.2.md | awk '{print $1}')"
            echo "code_sha256=$(sha256sum stability_arc/measurement_conditioned/c3_displacement_v02/c3_displacement_d3_high_precision_v02.py | awk '{print $1}')"
            echo "workflow_sha256=$(sha256sum .github/workflows/stability-arc-c3-displacement-d3-high-precision-v02.yml | awk '{print $1}')"
            echo "v01_failure_sha256=$(sha256sum stability_arc/measurement_conditioned/c3_displacement_v01/FAILURE_SIGNAL_REPORT_v0.1.md | awk '{print $1}')"
            echo "c3_derivation_result_sha256=$(sha256sum stability_arc/measurement_conditioned/c3_boundary_v01/C3_BOUNDARY_DERIVATION_RESULT_v0.1.md | awk '{print $1}')"
          } | tee "$R/source_identity.txt"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fixed remediation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'mpmath==1.3.0'
          python -m pip freeze | tee stability_arc/measurement_conditioned/c3_displacement_v02/results/environment_lock.txt

      - name: Execute frozen high-precision remediation
        shell: bash
        run: |
          set -euo pipefail
          python stability_arc/measurement_conditioned/c3_displacement_v02/c3_displacement_d3_high_precision_v02.py \
            | tee stability_arc/measurement_conditioned/c3_displacement_v02/results/stdout.txt

      - name: Preserve and independently verify evidence hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd stability_arc/measurement_conditioned/c3_displacement_v02/results
          find . -maxdepth 1 -type f ! -name SHA256.txt ! -name MANIFEST_VERIFIED.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256.txt
          sha256sum -c SHA256.txt | tee MANIFEST_VERIFIED.txt

      - name: Upload high-precision remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-arc-c3-displacement-d3-high-precision-v02
          path: stability_arc/measurement_conditioned/c3_displacement_v02/results/
          if-no-files-found: error
          retention-days: 90
