name: Chi Architecture D02A Source Schema

on:
  push:
    branches:
      - chi-architecture-p0
    paths:
      - "chi_architecture/d02_cspbbr3/D02A_PREEXECUTION_FREEZE_v0.1.json"
      - ".github/workflows/chi-architecture-d02a-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install schema-only dependencies
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5 requests==2.32.5

      - name: Fetch frozen publisher workbooks and emit schema only
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import requests
          from openpyxl import load_workbook

          freeze = json.loads(Path("chi_architecture/d02_cspbbr3/D02A_PREEXECUTION_FREEZE_v0.1.json").read_text())
          outdir = Path("chi_architecture/d02_cspbbr3/schema")
          outdir.mkdir(parents=True, exist_ok=True)

          inventory = {
              "schema": "d02a-source-schema-inventory-v0.1",
              "scientific_values_emitted": False,
              "files": [],
          }

          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0 reproducibility-bot/1.0"})

          for src in freeze["source"]["publisher_source_data"]:
              urls = [
                  src["url"],
                  src["url"].replace(
                      "https://media.springernature.com/original/springer-static/",
                      "https://static-content.springer.com/"
                  ),
              ]
              data = None
              last_error = None
              realized_url = None
              for url in urls:
                  try:
                      r = session.get(url, timeout=(15, 30))
                      r.raise_for_status()
                      if len(r.content) < 1024:
                          raise RuntimeError(f"download unexpectedly small: {len(r.content)} bytes")
                      data = r.content
                      realized_url = url
                      break
                  except Exception as exc:
                      last_error = repr(exc)
              if data is None:
                  raise RuntimeError(f'failed to fetch {src["id"]}: {last_error}')
              path = outdir / f'{src["id"]}.xlsx'
              path.write_bytes(data)

              wb = load_workbook(path, read_only=False, data_only=False)
              sheets = []
              for ws in wb.worksheets:
                  text_cells = []
                  formula_count = 0
                  numeric_count = 0
                  for row in ws.iter_rows():
                      for cell in row:
                          value = cell.value
                          if isinstance(value, str):
                              if value.startswith("="):
                                  formula_count += 1
                              elif value.strip():
                                  text_cells.append({
                                      "coordinate": cell.coordinate,
                                      "text": value.strip()[:240],
                                  })
                          elif isinstance(value, (int, float)) and value is not None:
                              numeric_count += 1
                  sheets.append({
                      "title": ws.title,
                      "max_row": ws.max_row,
                      "max_column": ws.max_column,
                      "merged_ranges": [str(x) for x in ws.merged_cells.ranges],
                      "text_cells": text_cells,
                      "numeric_cell_count": numeric_count,
                      "formula_count": formula_count,
                  })

              inventory["files"].append({
                  "id": src["id"],
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size_bytes": len(data),
                  "content_type": r.headers.get("content-type"),
                  "realized_url": realized_url,
                  "sheets": sheets,
              })

          Path("chi_architecture/d02_cspbbr3/D02A_SOURCE_SCHEMA_v0.1.json").write_text(
              json.dumps(inventory, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps({
              "status": "SOURCE_SCHEMA_COMPLETE",
              "files": [
                  {
                      "id": f["id"],
                      "sha256": f["sha256"],
                      "size_bytes": f["size_bytes"],
                      "sheet_count": len(f["sheets"]),
                  }
                  for f in inventory["files"]
              ],
          }, indent=2))
          PY

      - name: Guard no scientific numeric values are exported
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("chi_architecture/d02_cspbbr3/D02A_SOURCE_SCHEMA_v0.1.json")
          r = json.loads(p.read_text())
          assert r["scientific_values_emitted"] is False
          assert len(r["files"]) == 2
          for f in r["files"]:
              assert f["sha256"]
              assert f["size_bytes"] > 0
              assert len(f["sheets"]) > 0
              for s in f["sheets"]:
                  assert "numeric_values" not in s
          print("D02A schema-only guard passed")
          PY

      - name: Upload schema checkpoint artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chi-architecture-d02a-source-schema-v01
          path: chi_architecture/d02_cspbbr3/D02A_SOURCE_SCHEMA_v0.1.json
          retention-days: 90
          if-no-files-found: error
