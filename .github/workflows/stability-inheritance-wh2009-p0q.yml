name: Stability Inheritance WH2009 P0Q

on:
  push:
    branches:
      - stability-inheritance
    paths:
      - "stability_inheritance/run_wh2009_p0q_v0_1.py"
      - "stability_inheritance/WH2009_P0Q_PROTOCOL_v0.1.md"
      - ".github/workflows/stability-inheritance-wh2009-p0q.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wh2009:
    if: ${{ false }} # PROGRAM_WIDE_BILLING_GUARD: no paid GitHub-hosted execution
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out frozen branch state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"

      - name: Install pinned numerical dependency
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3
          python -m pip check

      - name: Record realized environment
        run: |
          mkdir -p stability_inheritance/results/wh2009
          {
            python --version
            python -m pip --version
            python -m pip freeze --all | sort
          } > stability_inheritance/results/wh2009/environment.txt

      - name: Run frozen WH2009 P0-Q scoring
        run: python stability_inheritance/run_wh2009_p0q_v0_1.py

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stability-inheritance-wh2009-p0q
          path: |
            stability_inheritance/results/wh2009/result.json
            stability_inheritance/results/wh2009/summary.md
            stability_inheritance/results/wh2009/environment.txt
          if-no-files-found: error
