name: D02E Healthy Baseline Mode Selection

on:
  push:
    branches: [chi-architecture-p0]
    paths:
      - "chi_architecture/d02e/healthy_baseline_select.py"
      - "chi_architecture/d02e/D02E_JACKET_MFR14_v0.1.md"
      - ".github/workflows/chi-architecture-d02e-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"
      - run: |
          python -m pip install --disable-pip-version-check -r chi_architecture/requirements-p0.txt
          python chi_architecture/d02e/healthy_baseline_select.py
      - name: Guard baseline-only selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("chi_architecture/results/D02E_HEALTHY_BASELINE_SELECTION_v0.1.json").read_text())
          assert r["healthy_file_count"]==20
          assert r["guard"].startswith("Only Healthy A_1")
          assert r["status"] in {"PRIMARY_MODE_SELECTED","NO_ADMISSIBLE_PRIMARY_MODE"}
          if r["status"]=="PRIMARY_MODE_SELECTED":
              assert r["primary_family"]["admitted_count"]>=16
          print("D02E baseline-only mode-selection guard passed")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d02e-healthy-baseline-selection-v01
          path: chi_architecture/results/D02E_HEALTHY_BASELINE_SELECTION_v0.1.json
          retention-days: 90
          if-no-files-found: error
