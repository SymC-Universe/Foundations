name: Substrate Inheritance Synthetic Validation

on:
  push:
    branches:
      - substrate-inheritance
    paths:
      - "substrate_inheritance/**"
      - ".github/workflows/substrate-inheritance.yml"
      - "README.md"
  pull_request:
    paths:
      - "substrate_inheritance/**"
      - ".github/workflows/substrate-inheritance.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest

      - name: Run adversarial unit tests
        run: python -m pytest -q substrate_inheritance/test_inheritance_engine.py

      - name: Run synthetic inheritance validation
        run: python substrate_inheritance/inheritance_engine.py

      - name: Verify output is explicitly non-physical
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("substrate_inheritance/results/synthetic_validation.json")
          data = json.loads(p.read_text())
          assert data["scope"] == "synthetic_software_validation_only"
          print("Synthetic scope guard passed")
          PY

      - name: Upload synthetic validation record
        uses: actions/upload-artifact@v4
        with:
          name: substrate-inheritance-synthetic-validation
          path: substrate_inheritance/results/synthetic_validation.json
