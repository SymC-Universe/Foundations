name: Substrate Inheritance Synthetic Validation

on:
  push:
    branches:
      - substrate-inheritance
    paths:
      - "substrate_inheritance/**"
      - ".github/workflows/substrate-inheritance.yml"
      - "README.md"
  pull_request:
    paths:
      - "substrate_inheritance/**"
      - ".github/workflows/substrate-inheritance.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest

      - name: Run adversarial unit and benchmark tests
        run: python -m pytest -q substrate_inheritance/test_*.py

      - name: Run synthetic inheritance validation
        run: python substrate_inheritance/inheritance_engine.py

      - name: Run ground-truth benchmark battery
        run: python substrate_inheritance/ground_truth_benchmarks.py

      - name: Verify outputs are explicitly non-physical
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path("substrate_inheritance/results/synthetic_validation.json").read_text())
          bench = json.loads(Path("substrate_inheritance/results/ground_truth_benchmarks.json").read_text())

          assert base["scope"] == "synthetic_software_validation_only"
          assert bench["scope"] == "synthetic_ground_truth_benchmark_only"
          assert bench["case_count"] == 10
          assert bench["physical_thresholds_frozen"] is False
          assert bench["real_system_evidence"] is False
          print("Synthetic evidence guards passed")
          PY

      - name: Upload synthetic validation records
        uses: actions/upload-artifact@v4
        with:
          name: substrate-inheritance-synthetic-validation
          path: |
            substrate_inheritance/results/synthetic_validation.json
            substrate_inheritance/results/ground_truth_benchmarks.json
